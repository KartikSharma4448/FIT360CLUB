<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | FIT 360 CLUB</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons via Unpkg -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#0a0a0a',
                            dark: '#141414',
                            red: '#ff3333',
                            white: '#f5f5f5',
                            card: '#111111',
                            border: '#222222',
                            gold: '#ffd166',
                        }
                    },
                    fontFamily: {
                        bebas: ['"Bebas Neue"', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-brand-black text-brand-white font-inter min-h-screen flex flex-col justify-between overflow-x-hidden antialiased">

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-brand-black/90 backdrop-blur-md border-b border-brand-border">
        <div class="container mx-auto px-4 md:px-8 max-w-7xl h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <i data-lucide="dumbbell" class="w-8 h-8 text-brand-red"></i>
                <span class="font-bebas text-2xl tracking-widest text-brand-white">FIT 360 CLUB</span>
            </a>
            <a href="/" class="bg-brand-red text-white px-6 py-2 font-poppins font-semibold hover:bg-red-600 transition-colors uppercase tracking-wide text-xs">
                Back to Home
            </a>
        </div>
    </header>

    <!-- 404 Hero Section -->
    <main class="flex-grow flex items-center justify-center relative px-4 pt-32 pb-16 overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-brand-red via-brand-dark to-brand-black"></div>
        
        <div class="container relative z-10 mx-auto max-w-2xl text-center">
            <span class="text-brand-red font-poppins font-bold uppercase tracking-[0.2em] mb-2 block text-sm">Lost Your Form?</span>
            <h1 class="text-8xl sm:text-9xl md:text-[10rem] font-bebas text-transparent bg-clip-text bg-gradient-to-r from-brand-gold to-brand-red leading-none mb-2 select-none">
                404
            </h1>
            <h2 class="text-2xl sm:text-3xl font-bebas tracking-wide text-brand-white mb-4 uppercase">
                Page Out Of Bounds
            </h2>
            <p class="text-gray-400 font-inter text-sm sm:text-base mb-8 max-w-md mx-auto">
                The page or workout routine you are looking for has been moved or doesn't exist. Let's get you back on track.
            </p>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/" class="w-full sm:w-auto bg-brand-red text-white px-8 py-3.5 font-poppins font-semibold hover:bg-red-600 transition-all uppercase tracking-wide text-sm flex items-center justify-center gap-2 shadow-lg shadow-brand-red/20">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Return to Home</span>
                </a>
                <a href="/#contact" class="w-full sm:w-auto border border-brand-border hover:border-brand-red bg-brand-dark text-gray-300 hover:text-white px-8 py-3.5 font-poppins font-semibold transition-colors uppercase tracking-wide text-sm flex items-center justify-center gap-2">
                    <i data-lucide="mail" class="w-4 h-4"></i>
                    <span>Contact Support</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-brand-border py-6 bg-brand-dark/50">
        <div class="container mx-auto px-4 md:px-8 max-w-7xl flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-gray-500">
            <p>© 2026 FIT 360 CLUB. All rights reserved.</p>
            <a href="/" class="hover:text-brand-white transition-colors">fit360club.vercel.app</a>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
